# Header and footer navigation. Field names map 1:1 to the WordPress menus /
# Carbon Fields the theme will use later.
#
# url:      page path, or "/#anchor" so it works from every page. Leave it out when the client has not
#           supplied a destination — the item renders as text + "destination
#           needed", never as a dead link.
# join:     true = the Join the Study control (non-navigating in this preview).

main:
  - label: About
    url: "/"          # About is the homepage
  - label: Study Details
    url: "/study-details/"
  - label: Updates
    url: "/updates/"
  - label: FAQ
    url: "/faq/"
  - label: Contact
    url: "/contact/"

footer:
  - heading: About the study
    id: about-the-study
    items:
      - label: Study overview
        url: "/#about"
      - label: What’s involved
        url: "/#whats-involved"
      - label: Our team
        url: "/#team"
      - label: Funding & Support
        url: "/#support"
      - label: Updates
        url: "/updates/"
      - label: Webinars (YouTube)
        url: "https://www.youtube.com/playlist?list=PLuAUZuB28M_TI7ZHrHSOFjnjrSLf-UmGt"
        external: true
  - heading: Take part
    id: take-part
    items:
      - label: Join the Study
        join: true
      - label: Who can join
        url: "/#eligibility"
      - label: FAQ
        url: "/faq/"
      # - label: Read the consent form     # removed until the client supplies the consent form URL
  - heading: Participant information
    id: participant-information
    # Heading only until the client supplies destinations for:
    #   Privacy and data use · Participant rights and IRB review · Accessibility
    items: []
  - heading: Contact the VIGOR team
    id: contact-the-vigor-team
    type: contact
    # PLACEHOLDER copy so the column is not empty in the prototype — replace the
    # `address` lines (and add `email`) once the client confirms the details.
    # The live site's UMass Chan details are NOT to be presented as confirmed
    # (manager, 2026-11-15):
    #   address: VIGOR Study Team / UMass Chan Medical School / Department of
    #            Dermatology / 364 Plantation Street / Worcester, MA 01605
    #   email:   vigor@umassmed.edu
    #   phone:   none supplied (508-555-1234 was fictional)
    address:
      - VIGOR Study Team
      - We’re happy to answer questions about the study.
      - Contact details will be published here.
