# Team roster — Figma 352:84, in display order.
# Field names mirror the Carbon Fields sub-fields:
#   name, role, institution, initials, portrait, bio
# Leave a field empty rather than guess. Empty role/institution are omitted;
# an empty bio is omitted from the modal. Bios are first person,
# the client's own copy — never rewrite to third person.
# Portraits are 848px squares cropped to the Figma framing.

- name: "Manuel Garber, PhD"
  role: "Co-lead investigator"
  institution: ""
  initials: "MG"
  portrait: "/assets/img/team/garber.jpg"
  bio: >
    As a co-lead investigator of this study, I am a computational biologist
    with a strong background in mathematics and a passion for applying new
    technologies to the study of immune responses. My interest in biology began
    with the sequencing of the human genome and has since focused on
    identifying the molecular signatures associated with different immune
    states.

- name: "John E. Harris, MD, PhD"
  role: "Co-lead investigator"
  institution: "UMass Chan Medical School"
  initials: "JH"
  portrait: "/assets/img/team/harris.jpg"
  bio: >
    As a co-lead investigator of this study, a board-certified dermatologist,
    and a physician-scientist, my career goal is to translate basic research
    findings into clinical applications that benefit individuals with vitiligo.
    I have received the AAD Marion B. Sulzberger Award for conducting basic
    science research that has changed the practice of medicine.

- name: "Todd Pearson, PhD"
  role: "Assistant professor, Dermatology"
  institution: ""
  initials: "TP"
  portrait: "/assets/img/team/pearson.jpg"
  bio: >
    I am an assistant professor in the department of Dermatology at UMass Chan
    Medical School. I received my Ph.D. in Immunology and Virology from the
    Morningside Graduate School of Biomedical Sciences at UMass Chan Medical
    School and have had a lifelong focus on understanding the genetic and
    cellular mechanisms that cause autoimmune diseases.

