title: VIGOR Study
description: A five-year, fully remote NIH study of what triggers vitiligo.
baseurl: "/VIGOR-Fable"
url: "https://scistoriesdev.github.io"
sass: { style: compressed }
exclude: [README.md, LICENSE, CLAUDE.md, Gemfile, Gemfile.lock, docs/]   # docs/ is reference material — never publish it
collections:
  updates:                     # one document per post, generated from the client's CMS export
    output: true
    permalink: /updates/:path/
defaults:
  - scope: { path: "", type: updates }
    values: { layout: post }
