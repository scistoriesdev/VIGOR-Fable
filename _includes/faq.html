{%- comment -%}
  Homepage FAQ · Figma 353:6 · WP template-parts/faq.php
  col-4 heading + col-8 accordion (faq-list.html). Links to the full FAQ page.
{%- endcomment -%}
<section id="faq" class="section-band" aria-labelledby="faq-h">
  <div class="section container faq">
    <div class="faq__head stack-4">
      <h2 id="faq-h" class="t-heading-section">Questions families ask</h2>
      <span class="keyline" aria-hidden="true"></span>
      <p><a class="t-ui-strong faq__more" href="{{ '/faq/' | relative_url }}">All questions and answers →</a></p>
    </div>
    {% include faq-list.html items=site.data.faq prefix="faq" %}
  </div>
</section>
<script src="{{ '/assets/js/faq.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
